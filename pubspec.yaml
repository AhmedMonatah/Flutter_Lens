name: font_lens
description: >-
  A live Flutter typography inspector overlay. Scans the widget tree,
  inspects rendered fonts and styles, and detects missing Arabic fallback fonts.
version: 0.1.1
homepage: https://github.com/AhmedMonatah/Flutter_Lens
repository: https://github.com/AhmedMonatah/Flutter_Lens
issue_tracker: https://github.com/AhmedMonatah/Flutter_Lens/issues

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter


